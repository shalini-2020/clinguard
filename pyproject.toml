[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "clinguard"
version = "0.1.3"
description = "Safety-first building blocks for clinical voice AI in low-resource languages and dialects"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Shalini Sivasamy" }]
keywords = ["healthcare", "nlp", "speech", "low-resource languages", "dialects",
            "ai safety", "guardrails", "human-in-the-loop", "clinical documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
clinguard = "clinguard.cli:main"

[project.urls]
Homepage = "https://github.com/shalini-2020/clinguard"
Issues = "https://github.com/shalini-2020/clinguard/issues"
Documentation = "https://github.com/shalini-2020/clinguard/blob/main/docs/ADAPTING.md"
Changelog = "https://github.com/shalini-2020/clinguard#changelog"

[tool.hatch.build.targets.wheel]
packages = ["src/clinguard"]
core-metadata-version = "2.3"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
