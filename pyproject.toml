[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "clinguard"
version = "0.1.0"
description = "Safety-first building blocks for clinical voice AI in low-resource languages and dialects"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shalini Sivasamy", email = "ss.shalini.2021@gmail.com" }]
keywords = ["healthcare", "nlp", "speech", "low-resource languages", "dialects",
            "ai safety", "guardrails", "human-in-the-loop", "clinical documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
clinguard = "clinguard.cli:main"

[project.urls]
Homepage = "https://github.com/shalini-2020/clinguard"
Issues = "https://github.com/shalini-2020/clinguard/issues"
"Live demo (BeaGrace Health)" = "https://ss-shalini-2021-beagrace.hf.space"

[tool.hatch.build.targets.wheel]
packages = ["src/clinguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
